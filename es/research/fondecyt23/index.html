<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FONDECYT Iniciación N°11230349 — Leonel Merino</title>
  <meta name="description" content="Mejorando la Colaboración y Movilidad de los Toolkits de Autoría de Analítica Inmersiva" />
  <link rel="alternate" hreflang="en" href="/en/research/fondecyt23/" />
  <link rel="alternate" hreflang="es" href="/es/research/fondecyt23/" />
  <link rel="alternate" hreflang="x-default" href="/en/research/fondecyt23/" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.2/css/academicons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:   #0092ca;
      --dark:   #252a34;
      --muted:  #6d7281;
      --border: #e8e8e8;
      --nav-h:  56px;
      --font:   -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { font-family: var(--font); font-size: 16px; line-height: 1.65; color: var(--dark); background: #fff; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { position: sticky; top: 0; z-index: 200; background: var(--dark); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 0 1.5rem; min-height: var(--nav-h); }
    nav .site-title { color: #fff; font-weight: 600; font-size: 1rem; letter-spacing: .02em; line-height: var(--nav-h); text-decoration: none; }
    nav .nav-links { list-style: none; display: flex; gap: 1.5rem; }
    nav .nav-links a { color: #ccc; font-size: .875rem; letter-spacing: .04em; text-transform: uppercase; transition: color .2s; display: block; padding: .5rem 0; }
    nav .nav-links a:hover { color: #fff; text-decoration: none; }
    .nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 5px; background: none; border: none; cursor: pointer; padding: .5rem; width: 44px; height: 44px; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; transition: transform .25s, opacity .25s; }
    nav.open .nav-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    nav.open .nav-toggle span:nth-child(2) { opacity: 0; }
    nav.open .nav-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .wrapper { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; display: grid; grid-template-columns: 240px 1fr; gap: 3rem; align-items: start; }
    aside.sidebar { position: sticky; top: calc(var(--nav-h) + 1rem); }
    .author__avatar { text-align: center; margin-bottom: 1.25rem; }
    .author__avatar img { width: 150px; height: auto; border-radius: 4px; display: inline-block; }
    .author__content { text-align: center; margin-bottom: 1rem; }
    .author__name { font-size: 1.1rem; font-weight: 700; margin-bottom: .35rem; }
    .author__bio { font-size: .83rem; color: var(--muted); line-height: 1.5; }
    .author__urls-wrapper { border-top: 1px solid var(--border); padding-top: .75rem; margin-top: .75rem; }
    ul.author__urls { list-style: none; display: flex; flex-direction: column; gap: 0; }
    ul.author__urls li { font-size: .83rem; color: var(--muted); }
    ul.author__urls li, ul.author__urls li a { display: flex; align-items: center; gap: .5rem; min-height: 26px; padding: .05rem 0; }
    ul.author__urls li a { color: var(--muted); width: 100%; transition: color .2s; text-decoration: none; }
    ul.author__urls li a:hover { color: var(--blue); }
    ul.author__urls .fa, ul.author__urls .fas, ul.author__urls .fab, ul.author__urls .ai { width: 16px; text-align: center; font-size: .9rem; flex-shrink: 0; }
    main { min-width: 0; }
    main h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: .6rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
    main p { margin-bottom: 1rem; font-size: .95rem; }
    main h2 { font-size: 1.15rem; font-weight: 700; margin-top: 2rem; margin-bottom: .75rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
    main ul { margin: 0 0 1rem 1.25rem; }
    main ul li { margin-bottom: .35rem; font-size: .92rem; }
    footer { margin-top: 4rem; border-top: 1px solid var(--border); padding: 1.5rem; text-align: center; font-size: .8rem; color: var(--muted); }
    @media (max-width: 860px) { .wrapper { grid-template-columns: 200px 1fr; gap: 2rem; } }
    @media (max-width: 640px) {
      .nav-toggle { display: flex; }
      nav .nav-links { display: none; flex-direction: column; gap: 0; width: 100%; padding: .5rem 0 1rem; order: 3; }
      nav.open .nav-links { display: flex; }
      nav .nav-links a { font-size: 1rem; padding: .75rem 0; border-top: 1px solid rgba(255,255,255,.08); min-height: 44px; }
      .wrapper { grid-template-columns: 1fr; padding: 1.5rem 1rem; gap: 1.5rem; }
      aside.sidebar { position: static; display: grid; grid-template-columns: 110px 1fr; gap: 1rem; align-items: start; }
      .author__avatar { margin-bottom: 0; }
      .author__avatar img { width: 100px; }
      .author__content { text-align: left; }
      .author__urls-wrapper { grid-column: 1 / -1; }
      ul.author__urls { flex-direction: row; flex-wrap: wrap; gap: .1rem .65rem; }
      ul.author__urls li, ul.author__urls li a { min-height: 26px; }
    }
  </style>
</head>
<body>
  <div id="navbar-slot"></div>
  <div class="wrapper">
    <div id="sidebar-slot"></div>
    <div id="body-slot"></div>
  </div>
  <footer>&copy; 2026 Leonel Merino &mdash; Pontifical Catholic University of Chile</footer>
  <script>
    async function loadComponent(url, targetId) {
      const res = await fetch(url);
      const html = await res.text();
      document.getElementById(targetId).innerHTML = html;
    }
    Promise.all([
      loadComponent('../../navbar.html',        'navbar-slot'),
      loadComponent('../../sidebar.html',       'sidebar-slot'),
      loadComponent('./fondecyt23-body.html',   'body-slot'),
    ]).then(() => {
      const nav = document.querySelector('nav');
      const toggle = document.querySelector('.nav-toggle');
      if (toggle && nav) {
        toggle.addEventListener('click', () => {
          const open = nav.classList.toggle('open');
          toggle.setAttribute('aria-expanded', open);
        });
        document.querySelectorAll('.nav-links a').forEach(a =>
          a.addEventListener('click', () => { nav.classList.remove('open'); toggle.setAttribute('aria-expanded', false); })
        );
      }
    });
  </script>
</body>
</html>
